name: Terraform CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
      - release/*
  push:
    branches:
      - develop
      - main
      - release/*
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

env:
  TF_VERSION: 1.6.6
  GCP_PROJECT_ID: your-gcp-project-id
  REGION: us-central1

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:

  #############################################
  # Detect Environment
  #############################################

  set-environment:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.setenv.outputs.env_name }}
    steps:
      - name: Determine Environment
        id: setenv
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "env_name=stage" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.environment }}" != "" ]]; then
            echo "env_name=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "No environment detected"
            exit 1
          fi

  #############################################
  # Terraform Plan
  #############################################

  terraform-plan:
    needs: set-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.env_name }}

    defaults:
      run:
        working-directory: ${{ needs.set-environment.outputs.env_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID
          service_account: terraform-deployer@your-gcp-project-id.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan.binary

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.set-environment.outputs.env_name }}
          path: ${{ needs.set-environment.outputs.env_name }}/tfplan.binary

  #############################################
  # Manual Approval for Stage & Prod
  #############################################

  approval:
    if: |
      needs.set-environment.outputs.env_name == 'stage' ||
      needs.set-environment.outputs.env_name == 'prod'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.set-environment.outputs.env_name }}
      url: https://console.cloud.google.com/

    steps:
      - name: Awaiting Approval
        run: echo "Manual approval required before apply"

  #############################################
  # Terraform Apply
  #############################################

  terraform-apply:
    needs:
      - set-environment
      - terraform-plan
      - approval
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.env_name }}

    defaults:
      run:
        working-directory: ${{ needs.set-environment.outputs.env_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID
          service_account: terraform-deployer@your-gcp-project-id.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.set-environment.outputs.env_name }}
          path: ${{ needs.set-environment.outputs.env_name }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan.binary

  #############################################
  # Security Scan (Optional but Recommended)
  #############################################

  security-scan:
    needs: terraform-plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ needs.set-environment.outputs.env_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec
        run: tfsec .